<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บอร์ดจองห้องประชุมและห้องโถง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans+Thai:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#132242;
    --ink-soft:#233254;
    --paper:#F6F4EF;
    --paper-raised:#FFFFFF;
    --amber:#D99E1F;
    --amber-deep:#B47E12;
    --slate:#5B6472;
    --line:#DEDACE;
    --good:#3A7856;
    --radius:10px;
    --shadow:0 1px 2px rgba(19,34,66,.06), 0 4px 14px rgba(19,34,66,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Archivo','Noto Sans Thai',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}

  .mono{font-family:'IBM Plex Mono',monospace;}

  /* header */
  header.board-head{
    background:var(--ink);
    color:var(--paper);
    padding:22px clamp(16px,4vw,40px) 18px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
  }
  .head-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    max-width:1180px;
    margin:0 auto;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .brand h1{
    margin:0;
    font-size:clamp(20px,2.6vw,28px);
    font-weight:800;
    letter-spacing:-.01em;
  }
  .clock{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:#C9D0DE;
    text-align:right;
  }
  .clock strong{color:var(--paper);font-size:15px;display:block;}

  .controls{
    max-width:1180px;
    margin:16px auto 0;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search-wrap{
    flex:1 1 260px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:10px 14px 10px 36px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    font-family:'Archivo','Noto Sans Thai',sans-serif;
    font-size:14px;
    outline:none;
  }
  .search-wrap input::placeholder{color:#9AA4B8;}
  .search-wrap input:focus{border-color:var(--amber);background:rgba(255,255,255,.14);}
  .search-wrap svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;stroke:#9AA4B8;
  }
  .view-toggle{
    display:flex;
    border-radius:999px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    padding:3px;
  }
  .view-toggle button{
    border:none;
    background:transparent;
    color:#C9D0DE;
    padding:7px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .view-toggle button.active{background:var(--amber);color:var(--ink);}
  .view-toggle button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .lang-toggle button{
    border:1px solid rgba(255,255,255,.24);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .lang-toggle button:hover{background:rgba(255,255,255,.16);}
  .lang-toggle button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  main{max-width:1180px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 60px;}

  /* legend / room filter */
  .legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 8px;}
  .legend-hint{font-size:11.5px;color:var(--slate);margin:0 0 14px;font-family:'IBM Plex Mono',monospace;}
  .legend-chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--ink-soft);
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 12px 5px 8px;
    cursor:pointer;
    font-weight:600;
    transition:opacity .12s ease, border-color .12s ease;
  }
  .legend-chip:hover{border-color:var(--amber-deep);}
  .legend-chip.off{opacity:.4;}
  .legend-chip:focus-visible{outline:2px solid var(--amber-deep);outline-offset:2px;}
  .legend-reset{
    font-size:11.5px;color:var(--amber-deep);background:transparent;border:none;
    cursor:pointer;font-weight:700;padding:5px 4px;text-decoration:underline;
  }
  .dot{width:9px;height:9px;border-radius:2px;flex:none;}

  /* month nav — shared between Calendar and List views */
  .month-nav{
    display:flex;align-items:center;justify-content:center;gap:16px;
    margin-bottom:18px;
    position:relative;
  }
  .month-nav button.step{
    border:1px solid var(--line);background:var(--paper-raised);
    width:34px;height:34px;border-radius:8px;cursor:pointer;
    color:var(--ink);font-size:16px;
  }
  .month-nav button.step:disabled{opacity:.3;cursor:not-allowed;}
  .month-nav button.step:focus-visible{outline:2px solid var(--amber-deep);outline-offset:2px;}

  .month-picker-wrap{position:relative;}
  .month-label-btn{
    margin:0;font-size:18px;font-weight:700;min-width:180px;text-align:center;
    border:1px solid transparent;background:transparent;color:var(--ink);
    border-radius:8px;padding:4px 10px;cursor:pointer;
    font-family:'Archivo','Noto Sans Thai',sans-serif;
    display:flex;align-items:center;gap:6px;justify-content:center;
  }
  .month-label-btn::after{
    content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid var(--slate);margin-top:2px;
  }
  .month-label-btn:hover{background:var(--paper-raised);border-color:var(--line);}
  .month-label-btn:focus-visible{outline:2px solid var(--amber-deep);outline-offset:2px;}
  .month-label-btn.open{background:var(--paper-raised);border-color:var(--amber-deep);}

  .month-popover{
    position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);padding:14px;z-index:70;width:236px;
  }
  .month-popover[hidden]{display:none;}
  .mp-year-row{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .mp-year-row button.mp-nav-arrow{
    border:none;background:transparent;cursor:pointer;font-size:15px;color:var(--ink);
    width:26px;height:26px;border-radius:6px;flex:none;
  }
  .mp-year-row button.mp-nav-arrow:hover{background:var(--paper);}
  .mp-year-row button.mp-nav-arrow:focus-visible{outline:2px solid var(--amber-deep);outline-offset:1px;}
  .mp-year-label{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
    background:transparent;border:none;cursor:pointer;color:var(--ink);
    padding:3px 8px;border-radius:6px;
  }
  .mp-year-label:hover{background:var(--paper);}
  .mp-year-label:focus-visible{outline:2px solid var(--amber-deep);outline-offset:1px;}
  .mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
  .mp-grid button{
    border:1px solid var(--line);background:var(--paper);border-radius:6px;
    padding:8px 4px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-weight:600;
  }
  .mp-grid button:hover{border-color:var(--amber-deep);}
  .mp-grid button.current{background:var(--amber);border-color:var(--amber-deep);color:var(--ink);}
  .mp-grid button.today-mark{box-shadow:0 0 0 1px var(--amber-deep) inset;}
  .mp-today-btn{
    width:100%;padding:7px;border-radius:6px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);font-size:12px;font-weight:600;cursor:pointer;
  }
  .mp-today-btn:hover{border-color:var(--amber-deep);color:var(--ink);}

  /* calendar */
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
  }
  .cal-dow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--slate);
    text-transform:uppercase;
    text-align:center;
    padding-bottom:4px;
  }
  .cal-cell{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    min-height:112px;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cal-cell.empty{background:transparent;border-color:transparent;}
  .cal-cell.today{border-color:var(--amber-deep);box-shadow:0 0 0 1px var(--amber-deep) inset;}
  .cal-daynum{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
  }
  .cal-cell.today .cal-daynum{color:var(--amber-deep);}
  .chip{
    border-radius:6px;
    padding:4px 6px;
    font-size:11.5px;
    line-height:1.25;
    cursor:pointer;
    border:none;
    text-align:left;
    color:#fff;
    font-family:'Archivo','Noto Sans Thai',sans-serif;
    font-weight:600;
  }
  .chip .t{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:10.5px;
    opacity:.9;
  }
  .chip:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  .cal-more{font-size:11px;color:var(--slate);font-family:'IBM Plex Mono',monospace;}

  .empty-note{
    text-align:center;color:var(--slate);font-size:13px;padding:30px 0;
  }

  /* list view */
  .list-wrap{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--slate);
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:focus-visible{outline:2px solid var(--amber-deep);outline-offset:-2px;}
  thead th .arrow{opacity:.35;margin-left:4px;font-size:10px;}
  thead th.sorted .arrow{opacity:1;color:var(--amber-deep);}
  tbody td{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF9F4;}
  td.date{font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  td.time{font-family:'IBM Plex Mono',monospace;white-space:nowrap;color:var(--ink-soft);}
  .room-pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:700;
    color:#fff;
  }
  .details{color:var(--slate);font-size:12.5px;}

  footer{
    max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 40px;
    color:var(--slate);font-size:12px;font-family:'IBM Plex Mono',monospace;
  }

  /* modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(19,34,66,.45);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .modal{
    background:var(--paper-raised);border-radius:var(--radius);
    max-width:360px;width:100%;padding:20px;box-shadow:var(--shadow);
  }
  .modal .room-pill{margin-bottom:10px;}
  .modal h3{margin:0 0 4px;font-size:17px;}
  .modal .when{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .modal p{margin:0 0 16px;font-size:13.5px;color:var(--slate);line-height:1.5;}
  .modal button.close{
    width:100%;padding:9px;border-radius:8px;border:none;
    background:var(--ink);color:#fff;font-weight:600;cursor:pointer;font-size:13.5px;
  }

  @media (max-width:720px){
    .cal-grid{grid-template-columns:repeat(7,1fr);}
    .cal-cell{min-height:auto;}
    .cal-dow{font-size:9.5px;}
    .cal-daynum{font-size:11px;}
    .chip{font-size:9.5px;padding:3px 4px;}
    .chip .t{font-size:9px;}
    thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tbody tr{border-bottom:1px solid var(--line);padding:10px 14px;}
    tbody td{border:none;padding:2px 0;}
    td.date{font-weight:700;}
  }

  @media (prefers-reduced-motion:no-preference){
    .cal-cell,.chip{transition:box-shadow .15s ease, transform .15s ease;}
    .chip:hover{transform:translateY(-1px);}
  }
</style>
</head>
<body>

<header class="board-head">
  <div class="head-row">
    <div class="brand">
      <span class="eyebrow" id="txtEyebrow">—</span>
      <h1 id="txtTitle">—</h1>
    </div>
    <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;">
      <div class="clock">
        <strong id="clockTime">--:--</strong>
        <span id="clockDate">…</span>
      </div>
      <div class="lang-toggle">
        <button id="langBtn" type="button">EN</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="…" autocomplete="off">
    </div>
    <div class="view-toggle" role="tablist" aria-label="View">
      <button id="btnCalView" class="active" role="tab" aria-selected="true">—</button>
      <button id="btnListView" role="tab" aria-selected="false">—</button>
    </div>
  </div>
</header>

<main>
  <div class="legend" id="legend"></div>
  <p class="legend-hint" id="txtLegendHint">—</p>

  <!-- Shared month/year navigator — filters BOTH the calendar and the list below -->
  <div class="month-nav">
    <button id="prevMonth" class="step" aria-label="Previous month">‹</button>
    <div class="month-picker-wrap">
      <button id="monthLabel" class="month-label-btn" aria-haspopup="true" aria-expanded="false">—</button>
      <div class="month-popover" id="monthPopover" hidden>
        <div class="mp-year-row">
          <button class="mp-nav-arrow" id="popPrevArrow" aria-label="Previous">‹</button>
          <button class="mp-year-label" id="popYearLabel">2026</button>
          <button class="mp-nav-arrow" id="popNextArrow" aria-label="Next">›</button>
        </div>
        <div class="mp-grid" id="popGrid"></div>
        <button class="mp-today-btn" id="popTodayBtn">—</button>
      </div>
    </div>
    <button id="nextMonth" class="step" aria-label="Next month">›</button>
  </div>

  <section id="calendarView">
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <section id="listView" style="display:none;">
    <div class="list-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="date"><span class="th-text" data-i18n="thDate"></span> <span class="arrow">▲</span></th>
            <th data-key="day"><span class="th-text" data-i18n="thDay"></span> <span class="arrow">▲</span></th>
            <th data-key="time"><span class="th-text" data-i18n="thTime"></span> <span class="arrow">▲</span></th>
            <th data-key="room"><span class="th-text" data-i18n="thRoom"></span> <span class="arrow">▲</span></th>
            <th data-key="event"><span class="th-text" data-i18n="thEvent"></span></th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <p class="empty-note" id="listEmpty" style="display:none;">—</p>
  </section>
</main>

<footer>
  <span id="txtLastUpdatedLabel">—</span> <span id="lastUpdatedTime"></span> · <span id="txtFooterRest">—</span>
</footer>

<div id="modalRoot"></div>

<script>
/* ============================================================
   CONFIG — point this at your published Google Sheet CSV URL.
   File ▸ Share ▸ Publish to web ▸ CSV, then paste the link below.
   Leave empty ("") to preview with sample data.
   Required columns (any order): date, day, room, time, event, details
   date format: YYYY-MM-DD
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRXE42FS_CtCLZUJjd29r85kJnGpb4-gopVm7s1xDZc4kLvdTzP_OMqi1ejSw7Po4jFVSnjt1-CD4Vn/pub?output=csv";
/* Colors are generated per-room (not picked from a short fixed list) using the
   "golden angle" hue step. This spreads hues as far apart as possible no matter
   how many rooms exist, so two rooms never end up with the same or a near-identical
   color even after the list grows past a handful of entries — the earlier version
   only had 8 hardcoded colors, so with 10 rooms it wrapped around and reused colors
   (Hall 1 = M6, Hall 2 = M7). Lightness/saturation are also nudged per room so that
   even hues that land close together still read as visibly different swatches. */
const roomColorMap = {};
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*Math.max(0,Math.min(1,x))).toString(16).padStart(2,"0");
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
function colorFor(room){
  if(!roomColorMap[room]){
    const idx = Object.keys(roomColorMap).length;
    const hue = (idx * 137.508) % 360;      // golden-angle spacing — max separation between any two hues
    const lightness = (idx % 2 === 0) ? 34 : 44;   // alternate dark/lighter so neighboring hues also differ in shade
    const sat = 58 + (idx % 3) * 7;                 // cycle saturation a little for further contrast
    roomColorMap[room] = hslToHex(hue, sat, lightness);
  }
  return roomColorMap[room];
}

/* Natural sort so "M2" sorts before "M10", Hall 1/2/3 stay in order, etc. */
function naturalSort(a,b){
  return a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"});
}

/* Sample data — replace by connecting SHEET_CSV_URL above.
   Rooms: Hall 1, Hall 2, Hall 3, and meeting rooms M1–M7 only. */
const SAMPLE_DATA = [
  {date:"2026-08-03",day:"Mon",time:"09:00–12:00",room:"M5",
    event_th:"ประชุมทีมผลิตภัณฑ์ Q3",event_en:"Product Sync Q3",
    details_th:"ห้องประชุมบอร์ด · 12 ท่าน",details_en:"Boardroom · 12 pax"},
  {date:"2026-08-05",day:"Wed",time:"13:00–17:00",room:"Hall 1",
    event_th:"ประชุมพันธมิตรประจำปี",event_en:"Annual Partners Meet",
    details_th:"จัดแบบโรงละคร · 200 ท่าน",details_en:"Theatre style · 200 pax"},
  {date:"2026-08-07",day:"Fri",time:"06:00–11:00",room:"M6",
    event_th:"กิจกรรม BNI Empower",event_en:"BNI Empower",
    details_th:"จัดแบบตัวยู · 50 ท่าน (เช้า/กลางวัน)",details_en:"U-shape · 50 pax (1B/1L)"},
  {date:"2026-08-10",day:"Mon",time:"14:00–16:00",room:"M7",
    event_th:"บรีฟฟิ่งผู้จำหน่าย",event_en:"Vendor Briefing",
    details_th:"จัดแบบห้องเรียน · 20 ท่าน",details_en:"Classroom · 20 pax"},
  {date:"2026-08-14",day:"Fri",time:"06:00–11:00",room:"M5",
    event_th:"กิจกรรม BNI Empower",event_en:"BNI Empower",
    details_th:"จัดแบบตัวยู · 50 ท่าน (เช้า/กลางวัน)",details_en:"U-shape · 50 pax (1B/1L)"},
  {date:"2026-08-14",day:"Fri",time:"13:00–15:00",room:"Hall 2",
    event_th:"ทาวน์ฮอลล์พนักงาน",event_en:"Staff Town Hall",
    details_th:"จัดแบบโรงละคร · 120 ท่าน",details_en:"Theatre · 120 pax"},
  {date:"2026-08-18",day:"Tue",time:"09:30–11:30",room:"M1",
    event_th:"ทบทวนงานดีไซน์",event_en:"Design Review",
    details_th:"ห้องประชุมบอร์ด · 10 ท่าน",details_en:"Boardroom · 10 pax"},
  {date:"2026-08-21",day:"Fri",time:"08:00–17:00",room:"Hall 3",
    event_th:"ประชุมฝ่ายขายระดับภูมิภาค",event_en:"Regional Sales Conference",

    event_th:"ประชุมนโยบายฝ่ายบุคคล",event_en:"HR Policy Session",
    details_th:"จัดแบบห้องเรียน · 25 ท่าน",details_en:"Classroom · 25 pax"},
  {date:"2026-08-27",day:"Thu",time:"15:00–18:00",room:"M3",
    event_th:"งานขอบคุณลูกค้า",event_en:"Client Appreciation Night",
    details_th:"จัดแบบต้อนรับ · 90 ท่าน",details_en:"Reception · 90 pax"},
  {date:"2026-09-02",day:"Wed",time:"09:00–11:00",room:"M4",
    event_th:"ทบทวนงบการเงิน",event_en:"Finance Review",
    details_th:"ห้องประชุมบอร์ด · 14 ท่าน",details_en:"Boardroom · 14 pax"},
  {date:"2026-09-11",day:"Fri",time:"06:00–11:00",room:"M5",
    event_th:"กิจกรรม BNI Empower",event_en:"BNI Empower",
    details_th:"จัดแบบตัวยู · 50 ท่าน (เช้า/กลางวัน)",details_en:"U-shape · 50 pax (1B/1L)"},
];

/* ---------- i18n ---------- */
const TRANSLATIONS = {
  th:{
    eyebrow:"เช็คตารางการจองห้องประชุมและห้องโถง",
    title:"จองห้องประชุมและห้องโถง",
    searchPlaceholder:"ค้นหาห้อง หรือกิจกรรม…",
    viewCal:"ปฏิทิน",
    viewList:"รายการ",
    legendHint:"คลิกที่ห้องเพื่อกรองแสดง/ซ่อน — มีผลทั้งมุมมองปฏิทินและรายการ",
    showAll:"แสดงทั้งหมด",
    jumpToday:"ไปยังเดือนนี้",
    noMatch:"ไม่พบรายการที่ตรงกับการค้นหา หรือเดือนที่เลือก",
    lastUpdatedLabel:"อัปเดตล่าสุด",
    footerRest:"หน้าเว็บรีเฟรชอัตโนมัติทุก 5 นาที · มุมมองสาธารณะ อ่านอย่างเดียว",
    close:"ปิด",
    noDetails:"ไม่มีรายละเอียดเพิ่มเติม",
    thDate:"วันที่",
    thDay:"วัน",
    thTime:"เวลา",
    thRoom:"ห้อง / ห้องโถง",
    thEvent:"กิจกรรม",
    langBtn:"EN",
    months:["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"],
    monthsShort:["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],
    dow:["อา","จ","อ","พ","พฤ","ศ","ส"],
    locale:"th-TH"
  },
  en:{
    eyebrow:"Check Meeting Room & Hall Availability",
    title:"Meeting Rooms & Halls",
    searchPlaceholder:"Search room, hall, or event…",
    viewCal:"Calendar",
    viewList:"List",
    legendHint:"Click a room to filter it in and out — applies to both Calendar and List views.",
    showAll:"Show all",
    jumpToday:"Jump to this month",
    noMatch:"No bookings match your search or the selected month.",
    lastUpdatedLabel:"Last updated",
    footerRest:"Page refreshes automatically every 5 minutes · Read-only public view",
    close:"Close",
    noDetails:"No additional details.",
    thDate:"Date",
    thDay:"Day",
    thTime:"Time",
    thRoom:"Room / Hall",
    thEvent:"Event",
    langBtn:"ไทย",
    months:["January","February","March","April","May","June","July","August","September","October","November","December"],
    monthsShort:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
    dow:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    locale:"en-US"
  }
};
let lang = "th";
function t(key){ return TRANSLATIONS[lang][key]; }

function applyLanguage(){
  document.documentElement.lang = lang;
  document.getElementById("txtEyebrow").textContent = t("eyebrow");
  document.getElementById("txtTitle").textContent = t("title");
  document.getElementById("searchInput").placeholder = t("searchPlaceholder");
  document.getElementById("btnCalView").textContent = t("viewCal");
  document.getElementById("btnListView").textContent = t("viewList");
  document.getElementById("txtLegendHint").textContent = t("legendHint");
  document.getElementById("popTodayBtn").textContent = t("jumpToday");
  document.getElementById("listEmpty").textContent = t("noMatch");
  document.getElementById("txtLastUpdatedLabel").textContent = t("lastUpdatedLabel");
  document.getElementById("txtFooterRest").textContent = t("footerRest");
  document.getElementById("langBtn").textContent = t("langBtn");
  document.querySelectorAll(".th-text[data-i18n]").forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  buildLegend();
  renderAll();
  tickClock();
}
document.getElementById("langBtn").addEventListener("click", ()=>{
  lang = (lang === "th") ? "en" : "th";
  applyLanguage();
});

let DATA = [];
let sortKey = "date";
let sortDir = 1;
let currentMonth = null;      // {y, m} — the month shown/filtered on Calendar AND List
let popoverYear = null;       // year shown inside the month-select popover
let popoverMode = "month";    // "month" | "year"
let yearGridStart = null;     // first year shown when popover is in year-select mode
let excludedRooms = new Set();// rooms toggled OFF in the room filter

/* event/details can be plain single-language columns, OR split per language:
   event_th, event_en, details_th, details_en — both are optional and can be
   mixed (e.g. only event_th/event_en provided, details plain). */
function parseCsvRows(rows){
  return rows.map(r=>({
    date:(r.date||r.Date||"").trim(),
    day:(r.day||r.Day||"").trim(),
    time:(r.time||r.Time||"").trim(),
    room:(r.room||r.Room||r["Room/Hall"]||"").trim(),
    event:(r.event||r.Event||"").trim(),
    event_th:(r.event_th||r.Event_th||r["event_TH"]||r["Event_TH"]||"").trim(),
    event_en:(r.event_en||r.Event_en||r["event_EN"]||r["Event_EN"]||"").trim(),
    details:(r.details||r.Details||"").trim(),
    details_th:(r.details_th||r.Details_th||r["details_TH"]||r["Details_TH"]||"").trim(),
    details_en:(r.details_en||r.Details_en||r["details_EN"]||r["Details_EN"]||"").trim(),
  })).filter(r=>r.date && r.room);
}

/* Pick the right-language value for a bilingual field, falling back to the
   other language, then to the plain (non-suffixed) column. */
function pick(item, key){
  const primary = item[key + "_" + lang];
  if(primary) return primary;
  const otherLang = lang === "th" ? "en" : "th";
  const secondary = item[key + "_" + otherLang];
  if(secondary) return secondary;
  return item[key] || "";
}

function loadData(){
  if(!SHEET_CSV_URL){
    DATA = SAMPLE_DATA.slice();
    afterLoad();
    return;
  }
  Papa.parse(SHEET_CSV_URL, {
    download:true, header:true, skipEmptyLines:true,
    complete:(res)=>{ DATA = parseCsvRows(res.data); afterLoad(); },
    error:()=>{ DATA = SAMPLE_DATA.slice(); afterLoad(); }
  });
}

function afterLoad(){
  DATA.sort((a,b)=>a.date.localeCompare(b.date));
  if(!currentMonth && DATA.length){
    const [y,m] = DATA[0].date.split("-").map(Number);
    currentMonth = {y, m:m-1};
  } else if(!currentMonth){
    const now = new Date();
    currentMonth = {y:now.getFullYear(), m:now.getMonth()};
  }
  popoverYear = currentMonth.y;
  applyLanguage();
  document.getElementById("lastUpdatedTime").textContent =
    new Date().toLocaleString(TRANSLATIONS[lang].locale, {dateStyle:"medium", timeStyle:"short"});
}

function allRooms(){
  return [...new Set(DATA.map(d=>d.room))].sort(naturalSort);
}

function buildLegend(){
  const rooms = allRooms();
  const el = document.getElementById("legend");
  el.innerHTML = rooms.map(r=>
    `<button type="button" class="legend-chip${excludedRooms.has(r)?" off":""}" data-room="${escapeHtml(r)}">
      <span class="dot" style="background:${colorFor(r)}"></span>${escapeHtml(r)}
    </button>`
  ).join("") + (excludedRooms.size ? `<button type="button" class="legend-reset" id="legendReset">${t("showAll")}</button>` : "");

  el.querySelectorAll(".legend-chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const room = chip.dataset.room;
      if(excludedRooms.has(room)) excludedRooms.delete(room); else excludedRooms.add(room);
      buildLegend();
      renderAll();
    });
  });
  const resetBtn = document.getElementById("legendReset");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    excludedRooms.clear();
    buildLegend();
    renderAll();
  });
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function currentQuery(){
  return document.getElementById("searchInput").value.trim().toLowerCase();
}

/* room + search filter only (no month restriction) */
function filtered(){
  const q = currentQuery();
  return DATA.filter(d=>{
    if(excludedRooms.has(d.room)) return false;
    if(!q) return true;
    return d.room.toLowerCase().includes(q) ||
      d.date.includes(q) ||
      d.day.toLowerCase().includes(q) ||
      pick(d,"event").toLowerCase().includes(q) ||
      pick(d,"details").toLowerCase().includes(q) ||
      (d.event_th||"").toLowerCase().includes(q) ||
      (d.event_en||"").toLowerCase().includes(q) ||
      (d.details_th||"").toLowerCase().includes(q) ||
      (d.details_en||"").toLowerCase().includes(q);
  });
}

/* room + search + selected month/year — used by BOTH Calendar and List */
function monthFiltered(){
  const {y,m} = currentMonth;
  return filtered().filter(d=>{
    const [dy,dm] = d.date.split("-").map(Number);
    return dy===y && (dm-1)===m;
  });
}

/* ---------- Calendar ---------- */
function renderCalendar(){
  const grid = document.getElementById("calGrid");
  const {y,m} = currentMonth;

  const data = monthFiltered();
  const byDay = {};
  data.forEach(d=>{
    const day = Number(d.date.split("-")[2]);
    (byDay[day] = byDay[day] || []).push(d);
  });

  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const dow = TRANSLATIONS[lang].dow;

  let html = dow.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;

  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const isToday = dateStr===todayStr;
    const items = (byDay[day]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
    const visible = items.slice(0,3);
    const rest = items.length-visible.length;
    html += `<div class="cal-cell${isToday?" today":""}">
      <div class="cal-daynum">${day}</div>
      ${visible.map((it,idx)=>`<button class="chip" style="background:${colorFor(it.room)}" data-day="${day}" data-idx="${idx}">${escapeHtml(it.room)} — ${escapeHtml(pick(it,"event"))}<span class="t">${escapeHtml(it.time)}</span></button>`).join("")}
      ${rest>0?`<div class="cal-more">+${rest}</div>`:""}
    </div>`;
  }

  grid.innerHTML = html;

  grid.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const day = Number(btn.dataset.day);
      const idx = Number(btn.dataset.idx);
      const items = (byDay[day]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
      openModal(items[idx]);
    });
  });

  updateMonthLabel();
}

function updateMonthLabel(){
  const {y,m} = currentMonth;
  document.getElementById("monthLabel").textContent = `${TRANSLATIONS[lang].months[m]} ${y}`;
}

/* ---------- Month / year picker popover ---------- */
function buildPopoverContent(){
  if(popoverMode === "month") buildMonthGrid(); else buildYearGrid();
}

function buildMonthGrid(){
  document.getElementById("popYearLabel").textContent = popoverYear;
  const wrap = document.getElementById("popGrid");
  const now = new Date();
  const monthsShort = TRANSLATIONS[lang].monthsShort;
  wrap.innerHTML = monthsShort.map((label, idx)=>{
    const isCurrent = popoverYear===currentMonth.y && idx===currentMonth.m;
    const isTodayMonth = popoverYear===now.getFullYear() && idx===now.getMonth();
    return `<button type="button" class="${isCurrent?"current":""}${isTodayMonth?" today-mark":""}" data-m="${idx}">${label}</button>`;
  }).join("");
  wrap.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentMonth = {y:popoverYear, m:Number(btn.dataset.m)};
      renderAll();
      closeMonthPopover();
    });
  });
}

function buildYearGrid(){
  document.getElementById("popYearLabel").textContent = `${yearGridStart}–${yearGridStart+11}`;
  const wrap = document.getElementById("popGrid");
  const now = new Date();
  let html = "";
  for(let i=0;i<12;i++){
    const yr = yearGridStart + i;
    const isCurrent = yr === popoverYear;
    const isThisYear = yr === now.getFullYear();
    html += `<button type="button" class="${isCurrent?"current":""}${isThisYear?" today-mark":""}" data-y="${yr}">${yr}</button>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      popoverYear = Number(btn.dataset.y);
      popoverMode = "month";
      buildPopoverContent();
    });
  });
}

function openMonthPopover(){
  popoverYear = currentMonth.y;
  popoverMode = "month";
  buildPopoverContent();
  document.getElementById("monthPopover").hidden = false;
  document.getElementById("monthLabel").classList.add("open");
  document.getElementById("monthLabel").setAttribute("aria-expanded","true");
}
function closeMonthPopover(){
  document.getElementById("monthPopover").hidden = true;
  document.getElementById("monthLabel").classList.remove("open");
  document.getElementById("monthLabel").setAttribute("aria-expanded","false");
  popoverMode = "month";
}
function toggleMonthPopover(){
  const hidden = document.getElementById("monthPopover").hidden;
  if(hidden) openMonthPopover(); else closeMonthPopover();
}

document.getElementById("monthLabel").addEventListener("click", (e)=>{
  e.stopPropagation();
  toggleMonthPopover();
});

/* clicking the year number switches the popover from month-select to year-select */
document.getElementById("popYearLabel").addEventListener("click", (e)=>{
  e.stopPropagation();
  if(popoverMode === "month"){
    popoverMode = "year";
    yearGridStart = popoverYear - 5;
  } else {
    popoverMode = "month";
  }
  buildPopoverContent();
});

document.getElementById("popPrevArrow").addEventListener("click", (e)=>{
  e.stopPropagation();
  if(popoverMode === "month"){ popoverYear--; } else { yearGridStart -= 12; }
  buildPopoverContent();
});
document.getElementById("popNextArrow").addEventListener("click", (e)=>{
  e.stopPropagation();
  if(popoverMode === "month"){ popoverYear++; } else { yearGridStart += 12; }
  buildPopoverContent();
});
document.getElementById("popTodayBtn").addEventListener("click", ()=>{
  const now = new Date();
  currentMonth = {y:now.getFullYear(), m:now.getMonth()};
  renderAll();
  closeMonthPopover();
});
document.getElementById("monthPopover").addEventListener("click", e=> e.stopPropagation());
document.addEventListener("click", ()=> closeMonthPopover());
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeMonthPopover(); });

document.getElementById("prevMonth").addEventListener("click", ()=>{
  currentMonth.m--; if(currentMonth.m<0){currentMonth.m=11;currentMonth.y--;}
  renderAll();
});
document.getElementById("nextMonth").addEventListener("click", ()=>{
  currentMonth.m++; if(currentMonth.m>11){currentMonth.m=0;currentMonth.y++;}
  renderAll();
});

function openModal(item){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" role="dialog" aria-modal="true">
        <span class="room-pill" style="background:${colorFor(item.room)}">${escapeHtml(item.room)}</span>
        <h3>${escapeHtml(pick(item,"event")||"—")}</h3>
        <div class="when">${escapeHtml(item.date)} · ${escapeHtml(item.day)} · ${escapeHtml(item.time)}</div>
        <p>${escapeHtml(pick(item,"details")||t("noDetails"))}</p>
        <button class="close">${t("close")}</button>
      </div>
    </div>`;
  const backdrop = document.getElementById("modalBackdrop");
  backdrop.addEventListener("click", e=>{ if(e.target===backdrop) root.innerHTML=""; });
  root.querySelector(".close").addEventListener("click", ()=> root.innerHTML="");
}

/* ---------- List (now filtered to the selected month too) ---------- */
function renderList(){
  const rows = monthFiltered().slice().sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(sortKey==="time"){ av=a.date+a.time; bv=b.date+b.time; }
    if(sortKey==="event"){ av=pick(a,"event"); bv=pick(b,"event"); }
    if(sortKey==="room") return naturalSort(av,bv) * sortDir;
    return av.localeCompare(bv) * sortDir;
  });
  const body = document.getElementById("listBody");
  document.getElementById("listEmpty").style.display = rows.length? "none":"block";
  body.innerHTML = rows.map(r=>`
    <tr>
      <td class="date">${escapeHtml(r.date)}</td>
      <td>${escapeHtml(r.day)}</td>
      <td class="time">${escapeHtml(r.time)}</td>
      <td><span class="room-pill" style="background:${colorFor(r.room)}">${escapeHtml(r.room)}</span></td>
      <td>${escapeHtml(pick(r,"event"))}${pick(r,"details")?`<div class="details">${escapeHtml(pick(r,"details"))}</div>`:""}</td>
    </tr>`).join("");

  document.querySelectorAll("thead th").forEach(th=>{
    th.classList.toggle("sorted", th.dataset.key===sortKey);
    const arrow = th.querySelector(".arrow");
    if(th.dataset.key===sortKey) arrow.textContent = sortDir===1 ? "▲" : "▼";
  });
}

function renderAll(){
  renderCalendar();
  renderList();
}

/* ---------- Events ---------- */
document.getElementById("searchInput").addEventListener("input", renderAll);

document.getElementById("btnCalView").addEventListener("click", ()=> switchView("cal"));
document.getElementById("btnListView").addEventListener("click", ()=> switchView("list"));
function switchView(which){
  const cal = which==="cal";
  document.getElementById("calendarView").style.display = cal? "block":"none";
  document.getElementById("listView").style.display = cal? "none":"block";
  document.getElementById("btnCalView").classList.toggle("active", cal);
  document.getElementById("btnListView").classList.toggle("active", !cal);
  document.getElementById("btnCalView").setAttribute("aria-selected", cal);
  document.getElementById("btnListView").setAttribute("aria-selected", !cal);
}

document.querySelectorAll("thead th").forEach(th=>{
  th.setAttribute("tabindex","0");
  const activate = ()=>{
    const key = th.dataset.key;
    if(sortKey===key) sortDir *= -1; else { sortKey=key; sortDir=1; }
    renderList();
  };
  th.addEventListener("click", activate);
  th.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); activate(); }});
});

/* ---------- Clock ---------- */
function tickClock(){
  const now = new Date();
  const locale = TRANSLATIONS[lang].locale;
  document.getElementById("clockTime").textContent = now.toLocaleTimeString(locale, {hour:"2-digit", minute:"2-digit"});
  document.getElementById("clockDate").textContent = now.toLocaleDateString(locale, {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
setInterval(tickClock, 1000*30);

/* ---------- Init + auto refresh ---------- */
loadData();
setInterval(loadData, 1000*60*5);
</script>
